<h2>Reset your Stockpot password</h2>
<p>Tap the button to choose a new password. The link works once and expires in an hour.</p>
<p><a href="{{ .SiteURL }}/api/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#2563eb;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none">Choose a new password</a></p>
<p style="color:#64748b;font-size:12px">If you didn't ask for this, ignore this email; your password stays the same.</p>
